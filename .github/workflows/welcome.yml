name: Welcome New Contributors

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

jobs:
  welcome:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: >
            👋 Welcome to EdgeBrain! Thank you for opening your first issue.
            A maintainer will review it shortly.
          pr-message: >
            👋 Welcome to EdgeBrain! Thank you for your first pull request!
            A maintainer will review your PR soon.
